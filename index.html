<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pickaxe Nailer</title>
<style>
html,body{margin:0;height:100%;background:#1b1209;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",system-ui,sans-serif}
canvas{display:block;position:absolute;left:0;top:0;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(24,12,2,.66);color:#fff;text-align:center;gap:16px}
.ov.h{display:none}
h1{margin:0;font-size:clamp(30px,7vw,64px);color:#ffd36b;text-shadow:0 4px 0 #6b3a10;letter-spacing:.02em}
p{margin:0;font-size:clamp(14px,2.4vw,20px);max-width:min(560px,86%);line-height:1.5}
button{font:700 clamp(18px,3vw,28px) "Trebuchet MS",system-ui,sans-serif;padding:.5em 1.8em;border:0;border-radius:999px;background:#ffb02e;color:#3a1c00;box-shadow:0 5px 0 #9a5a00;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #9a5a00}
button:focus-visible{outline:3px solid #fff}
#mute{position:absolute;right:10px;top:10px;font-size:20px;padding:.3em .7em;z-index:5}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="ov" id="start"><h1>Pickaxe Nailer</h1><p id="desc"></p><button id="play"></button></div>
<div class="ov h" id="clear"><h1 id="ct"></h1><p id="res"></p><button id="again"></button></div>
<button id="mute" aria-label="Sound">🔊</button>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<script>
// ---------- Poki SDK (falls back to a stub when not on Poki / offline) ----------
const P=window.PokiSDK||{init:()=>Promise.resolve(),gameLoadingFinished(){},gameplayStart(){},gameplayStop(){},commercialBreak:(cb)=>{cb&&cb();return Promise.resolve()},happyTime(){},setDebug(){}};
let userMute=false,adMute=false;
P.init().catch(()=>{}).then(()=>{try{P.gameLoadingFinished()}catch(e){}});

// ---------- Text ----------
const ja=/^ja/.test(navigator.language);
const T=ja?{desc:'ハンマーをドラッグして、釘に振り下ろそう。勢いが強いほど深く刺さる。でも面を斜めに当てると釘が曲がってしまう！',play:'あそぶ',hint:'ハンマーをドラッグして振り下ろそう！',clear:'クリア！',again:'もう一回',nails:'釘',time:'タイム',hits:'打数',perfect:'パーフェクト！',bent:'曲がった！'}
:{desc:'Drag the hammer and swing it down on the nails. The harder you hit, the deeper they go — but hit with a tilted face and the nail bends!',play:'Play',hint:'Drag the hammer, then swing it down!',clear:'Cleared!',again:'Play again',nails:'Nails',time:'Time',hits:'Swings',perfect:'PERFECT!',bent:'BENT!'};
const $=id=>document.getElementById(id);
Object.assign(T,ja?{desc:'ピッケルを掴んで振り、丸太の釘を打ち込もう。勢いが強いほど深く刺さる。判定は両端の黄色い先端の一点だけ。まっすぐ突き立てるのがコツ。斜めに当てると刺さりにくくなる！',hint:'ピッケルをドラッグして、釘に振り下ろそう！'}:{desc:'Grab the pickaxe and swing it to drive the nails into the log. Harder hits sink them deeper. Only the yellow pick tips count — hit squarely with one — a tilted hit sinks the nail less!',hint:'Drag the pickaxe, then swing it down on the nails!'});$('desc').textContent=T.desc;$('play').textContent=T.play;$('ct').textContent=T.clear;$('again').textContent=T.again;

// ---------- Canvas ----------
const W=854,H=480,GY0=333,LD=900,NS=3,LX=758,PX=W+800,PY=-200,HX=862,HY=-250,Z=.5,VW=W/Z,VH=H/Z,VHN=1200,VX0=-100,VY0=-560;
let GY=GY0,OY=0,POY=0,CY=VY0; // POY: eased copy of OY that the handle's target point follows // GY: top of the current log, OY: vertical offset of the current level, CY: camera top (lags behind)
const NW=11*NS; // nail head half-width (shared by drawing and hit detection)
const NO='#2b2f3a',NL=3; // nail outline color / thickness
const NH=8*NS; // nail hit-detection depth: only the head (top part) of the nail can be hit
const cv=$('c'),g=cv.getContext('2d');
let sc=1,ox=0,oy=0,dpr=1;
function fit(){dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';sc=Math.min(cv.width/VW,cv.height/VHN);ox=(cv.width-VW*sc)/2;oy=(cv.height-VHN*sc)/2}
addEventListener('resize',fit);fit();

// ---------- Audio ----------
let ac;const lastS={};
function AC(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function snd(k,f,d,type,v,sl){const now=performance.now();if(userMute||adMute||now-(lastS[k]||0)<70)return;lastS[k]=now;const a=AC();if(!a)return;const o=a.createOscillator(),n=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(a.destination);o.start(t);o.stop(t+d)}
// metallic strike: noise click + inharmonic ringing partials + low wood thud; louder with speed, higher as the nail goes in
function hitSnd(v,deep){
  const now=performance.now();if(userMute||adMute||now-(lastS.h||0)<60)return;lastS.h=now;
  const a=AC();if(!a)return;
  const t=a.currentTime,vol=Math.max(.15,Math.min(1,v/2500)),dp=Math.max(0,Math.min(1,deep));
  const len=a.sampleRate*.04|0,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len)**2;
  const ns=a.createBufferSource(),hp=a.createBiquadFilter(),ng=a.createGain();
  ns.buffer=buf;hp.type='highpass';hp.frequency.value=2500;ng.gain.value=.45*vol;
  ns.connect(hp);hp.connect(ng);ng.connect(a.destination);ns.start(t);
  const base=1700+dp*1300;
  [[1,.22,.14],[2.76,.12,.09],[5.4,.07,.05]].forEach(([r,gn,du])=>{
    const o=a.createOscillator(),n=a.createGain();
    o.type='sine';o.frequency.value=base*r;
    n.gain.setValueAtTime(gn*vol,t);n.gain.exponentialRampToValueAtTime(.001,t+du);
    o.connect(n);n.connect(a.destination);o.start(t);o.stop(t+du);
  });
  const o=a.createOscillator(),n=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(55,t+.12);
  n.gain.setValueAtTime(.35*vol,t);n.gain.exponentialRampToValueAtTime(.001,t+.12);
  o.connect(n);n.connect(a.destination);o.start(t);o.stop(t+.12);
}
$('mute').onclick=()=>{userMute=!userMute;$('mute').textContent=userMute?'🔇':'🔊'};

// ---------- Game state ----------
const S=3,VMIN=700,DK=1.2,M=1,I=22000*S*S,KA=3600000*S*S,KW=260000*S*S,GR=1500,DT=1/480,KP=120,KD=14,FMAX=18000;
const GP=[-78*S,114*S]; // fixed grab point (local coords): the lower tip of the blade
// local collision points: [x,y,radius]  (handle runs along local x, head faces are local ±y)
// kind: 0 = handle/side, 1 = flat face (adze), 2 = pick tip
const PTS=[];for(let x=-77*S;x<=387*S;x+=22)PTS.push([x,0,8*S,0]);
for(let y=-60*S;y<=60*S;y+=30)PTS.push([-83*S,y,11*S,0]);
PTS.push([-78*S,114*S,0,2],[-78*S,-114*S,0,2]);
let hm,nails,parts,texts,shake,t,hits,hint,grab,frozen,state='menu';
let hs=0,wsh=false,ts=1,zm=0,bt=0;const trail=[[],[]]; // hs: hit-stop time left, wsh: whoosh already played for this swing, trail: recent positions of the two pick tips
let broke,debris,flash,wave,winT,landed,lt,lv,ptr;
const BX=327,BR=24,BYO=274;let BY=GY+BYO; // bomb buried so the nail tip (GY+252 at max depth) just touches its top
const mouse={x:0,y:0};
function reset(){
  hm={x:HX,y:HY,a:Math.atan2(PY-HY,PX-HX),vx:0,vy:0,w:0};frozen=true;
  GY=GY0;OY=0;POY=0;CY=VY0;BY=GY+BYO;lv=0;landed=false;lt=0;ptr=null;
  nails=[mkNail(GY0,84*NS),mkNail(GY0+LD,70*NS)]; // current nail + the one already stuck in the log below
  parts=[];texts=[];shake=0;t=0;hs=0;wsh=false;ts=1;zm=0;bt=0;trail[0].length=trail[1].length=0;hits=0;hint=true;grab=null;
  broke=false;debris=[];flash=0;wave=null;clearTimeout(winT);
}
function mkNail(gy,h){return{x:BX,gy,h,bent:0,done:false}}
reset();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrapA=x=>((x+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
function wp(p){const c=Math.cos(hm.a),s=Math.sin(hm.a),rx=c*p[0]-s*p[1],ry=s*p[0]+c*p[1];return[hm.x+rx,hm.y+ry,rx,ry]}
function surf(x,tp,yb){ // yb: bottom of the contact point. A nail only collides at its head (top NH px); everywhere else the log itself is the surface
  const lg=x<=LX?(broke?GY+LD:GY):1e9;
  if(tp)for(const n of nails)if(!n.done&&!n.gone&&Math.abs(x-n.x)<NW){const top=n.gy-n.h;if(top<lg&&yb<=top+NH)return[top,n]} // nails of logs further down (top>=lg) never act as a surface
  return[lg,null]}
function spawn(){hm.x=HX;hm.y=HY+OY;hm.a=Math.atan2(PY-HY,PX-HX);hm.vx=hm.vy=hm.w=0;frozen=!grab} // a held pick stays held on restart
function advance(){ // the hammer has landed on the log below: that log becomes the current one, and a new one is stuck in below it
  GY+=LD;OY+=LD;BY=GY+BYO;broke=false;landed=false;lt=0;bt=0;lv++;hint=false;
  nails=nails.filter(n=>!n.gone);nails.push(mkNail(GY+LD,70*NS));
}
function burst(x,y,n,col,sp){for(let i=0;i<n;i++){const a=-Math.PI*Math.random();parts.push({x,y,vx:Math.cos(a)*sp*Math.random(),vy:Math.sin(a)*sp*Math.random(),l:.5+Math.random()*.4,c:col})}}
function say(x,y,s,c,z){texts.push({x,y,s,c,z,l:1})}

function step(dt){
  if(frozen)return;
  hm.vy+=GR*(broke?2.2:1)*dt; // heavier gravity on the pick after the explosion
  if(grab){ // pull the grabbed point toward the cursor with a limited spring force
    const c=Math.cos(hm.a),s=Math.sin(hm.a),rx=c*grab[0]-s*grab[1],ry=s*grab[0]+c*grab[1];
    const vx=hm.vx-hm.w*ry,vy=hm.vy+hm.w*rx;
    let fx=KP*(mouse.x-(hm.x+rx))-KD*vx,fy=KP*(mouse.y-(hm.y+ry))-KD*vy;
    const f=Math.hypot(fx,fy);if(f>FMAX){fx*=FMAX/f;fy*=FMAX/f}
    hm.vx+=fx/M*dt;hm.vy+=fy/M*dt;hm.w+=(rx*fy-ry*fx)/I*dt;
  }
  {const da=wrapA(Math.atan2(PY+POY-hm.y,PX-hm.x)-hm.a);hm.w+=(KA*da-KW*hm.w)/I*dt} // handle is pulled to point at a far point on the right
  hm.w*=1-1.2*dt;hm.vx*=1-.15*dt;hm.w=clamp(hm.w,-40,40);
  hm.x+=hm.vx*dt;hm.y+=hm.vy*dt;hm.a+=hm.w*dt;
  let maxPen=0;
  for(const p of PTS){
    const[X,Y,rx,ry]=wp(p),[sy,n]=surf(X,p[3]==2,Y+p[2]),pen=Y+p[2]-sy;
    if(!broke&&X<LX&&X>LX-30*NS&&Y>GY+10&&Y<GY+150*NS&&hm.vx<0){hm.x+=LX-X;hm.vx*=-.1;continue}
    if(pen<=0||pen>60)continue;
    maxPen=Math.max(maxPen,pen);
    const vy=hm.vy+hm.w*rx;
    if(vy<=0)continue;
    const j=(1+(n?.1:.25))*vy/(1/M+rx*rx/I);
    hm.vy-=j/M;hm.w-=rx*j/I;
    const vt=hm.vx-hm.w*ry,jt=clamp(-vt/(1/M+ry*ry/I),-.6*j,.6*j);
    hm.vx+=jt/M;hm.w-=ry*jt/I;
    if(n&&n.gy===GY&&vy>VMIN&&!n.sk){
      // flatness of the hitting surface: 1 = face parallel to the nail head
      const tl=Math.abs(wrapA(hm.a-(p[1]<0?Math.PI:0))),fl=Math.cos(tl*1.6);
      let eff=clamp((fl-.5)/.5,.12,1);
      
      
      const d=DK*eff*NS*((vy-VMIN)/500)**2;
      n.h-=d;hits++;hint=false;
      if(eff>.9&&vy>1300){say(n.x,sy-60,T.perfect,'#ffe27a',96);hs=Math.max(hs,.13);shake=Math.max(shake,18);zm=Math.max(zm,.06);flash=Math.max(flash,.18);burst(n.x,sy,14,'#ffe27a',620)} // PERFECT: big hit-stop, zoom pop, flash and sparks
      shake=Math.max(shake,Math.min(14,vy/130));hs=Math.max(hs,Math.min(.08,.03+(vy-VMIN)/9000)); // hit-stop: freeze the physics for a moment on a hard hit
      burst(n.x,sy,Math.min(14,4+vy/200|0),'#d9d9e0',Math.min(500,vy/3));
      hitSnd(vy,1-n.h/(84*NS));
      if(n.h<=4*NS){n.sk={t:0,from:4*NS,to:4*NS,s:false};n.h=4*NS} // final blow: the nail goes in all the way at once (no slow slide); the short beat before the explosion is unchanged
    }else if(!n&&vy>250){
      shake=Math.max(shake,Math.min(8,vy/250));burst(X,sy,5,'#c98a4b',260);snd('g',120,.14,'sine',Math.min(.4,vy/1500),50);
    }
  }
  hm.y-=maxPen;
  if(broke&&maxPen>0)landed=true; // after the explosion the only thing left to touch is the next log (or its nail)
  if(hm.x<-200){hm.x=-200;hm.vx=Math.abs(hm.vx)*.3}
  if(hm.x>W+900){hm.x=W+900;hm.vx=-Math.abs(hm.vx)*.3}
  
  if(!broke&&hm.y>GY+850)spawn() // (only puts the pick back; it is not checked during the explosion sequence at all)
}

// ---------- Bomb ----------
function boomSnd(){ // casual-game style explosion: bright "pop", short punchy thump, a puff of noise and a little sparkle arpeggio (about half a second, no long rumble)
  if(userMute||adMute)return;const a=AC();if(!a)return;const t0=a.currentTime;
  const out=a.createGain(),cp=a.createDynamicsCompressor();out.gain.value=.85;out.connect(cp);cp.connect(a.destination);
  const tone=(type,f0,f1,at,d,v)=>{const o=a.createOscillator(),g=a.createGain(),t=t0+at;o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.02)};
  tone('triangle',1100,160,0,.14,.9);   // the "pop"
  tone('sine',240,60,0,.38,.85);        // short thump underneath
  tone('square',520,130,0,.1,.18);      // a bit of bite
  const len=a.sampleRate*.24|0,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const ns=a.createBufferSource(),bp=a.createBiquadFilter(),ng=a.createGain();ns.buffer=buf;bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=.7;ng.gain.value=.55;
  ns.connect(bp);bp.connect(ng);ng.connect(out);ns.start(t0); // puff
  [784,988,1175,1568,1976].forEach((f,i)=>tone('triangle',f,f,.05+i*.055,.16,.22)); // sparkle
}
function blast(n){
  if(broke)return;broke=true;bt=0;n.gone=true; // (a held pick stays held through the explosion)
  boomSnd();flash=1;shake=45;wave={t:0};
  const cols=['#d9a05a','#b57a3a','#8a5a2a','#7a4c22','#5a3718'];
  for(let x=-110;x<LX+30;x+=52)for(let y=GY;y<GY+150*NS;y+=52){
    const cx=x+Math.random()*40,cy=y+Math.random()*40,dx=cx-BX,dy=cy-BY,dist=Math.hypot(dx,dy)||1,sp=450+Math.random()*900;
    debris.push({x:cx,y:cy,vx:dx/dist*sp,vy:dy/dist*sp-450-Math.random()*400,a:Math.random()*6.28,w:(Math.random()-.5)*14,
      sw:22+Math.random()*34,sh:16+Math.random()*30,c:cols[Math.random()*cols.length|0],l:4});
  }
  // nails already lying on this log (from earlier blasts) are blown away with it
  for(const d of debris)if(d.nail){const dx=d.x-BX,dy=d.y-BY,dist=Math.hypot(dx,dy)||1,sp=450+Math.random()*900;d.asleep=false;d.st=0;d.vx=dx/dist*sp;d.vy=dy/dist*sp-450-Math.random()*400;d.w=(Math.random()-.5)*14}
  // the nail itself is blown away too: it keeps flying (no lifetime) and piles up on the log below, and is removed only when it falls away
  debris.push({nail:true,x:n.x+(Math.random()-.5)*30,y:GY+110,vx:(Math.random()-.5)*600,vy:-700-Math.random()*500,a:(Math.random()-.5)*.6,w:(Math.random()-.5)*22,l:Infinity,asleep:false,st:0,ct:0}); // launch speed/spin vary every time (the simulation itself is deterministic)
  const fc=['#fff3b0','#ffd34d','#ff9a2e','#ff5a1f','#3a2a22'];
  for(let i=0;i<110;i++){const a=Math.random()*6.28,sp=Math.random()*1100;
    parts.push({x:BX,y:BY,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-200,l:.5+Math.random()*.9,c:fc[Math.random()*fc.length|0],s:6+Math.random()*16})}
  say(BX,GY-60,'BOOM!','#ffb347');
  hm.vy-=1400;hm.w+=10;
  landed=false;lt=0; // the game continues on the log below
}

// ---------- Flow ----------
function win(){
  state='clear';grab=null;
  try{P.gameplayStop();P.happyTime(1)}catch(e){}
  $('res').textContent=`${T.time}: ${t.toFixed(1)}s  /  ${T.hits}: ${hits}`;
  $('clear').classList.remove('h');
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd('w'+i,f,.3,'triangle',.25),i*120));
}
function begin(){reset();state='play';$('start').classList.add('h');$('clear').classList.add('h');try{P.gameplayStart()}catch(e){}}
$('play').onclick=()=>{AC();begin()};
$('again').onclick=()=>{
  AC();$('clear').classList.add('h');
  let p;try{p=P.commercialBreak(()=>{adMute=true})}catch(e){}
  Promise.resolve(p).catch(()=>{}).then(()=>{adMute=false;begin()});
};

// ---------- Input ----------
function pos(e){return{x:(e.clientX*dpr-ox)/sc+VX0,y:(e.clientY*dpr-oy)/sc+CY}}
cv.addEventListener('pointerdown',e=>{
  ptr=e;const m=pos(e);mouse.x=m.x;mouse.y=m.y;
  if(state!=='play')return; // the hammer can be grabbed during the explosion too
  frozen=false;grab=[GP[0],GP[1]];cv.setPointerCapture(e.pointerId); // touching anywhere on the screen counts as holding the pickaxe (it is pulled towards the finger by its grip point)
});
cv.addEventListener('pointermove',e=>{ptr=e;const m=pos(e);mouse.x=m.x;mouse.y=m.y});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{grab=null}));
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
addEventListener('contextmenu',e=>e.preventDefault());

// ---------- Drawing ----------
function drawLog(gy){
  const lg=g.createLinearGradient(0,gy,0,gy+150*NS);lg.addColorStop(0,'#d9a05a');lg.addColorStop(.5,'#b57a3a');lg.addColorStop(1,'#7a4c22');
  g.fillStyle=lg;g.beginPath();g.roundRect?g.roundRect(-4000,gy,LX+4000,150*NS,[0,34*NS,34*NS,0]):g.rect(-4000,gy,LX+4000,150*NS);g.fill();
  g.fillStyle='rgba(255,230,170,.4)';g.fillRect(-4000,gy,LX+4000-30*NS,4*NS);
  g.strokeStyle='rgba(70,36,10,.35)';g.lineWidth=2*NS;
  for(let k=0;k<6;k++){g.beginPath();for(let x=-60;x<=LX-24*NS;x+=20){const y=gy+(18+k*22)*NS+Math.sin(x*.012+k*2)*4*NS;x==-60?g.moveTo(x,y):g.lineTo(x,y)}g.stroke()}
  g.fillStyle='rgba(70,36,10,.45)';[[150,gy+50*NS],[420,gy+85*NS]].forEach(k=>{g.beginPath();g.ellipse(k[0],k[1],16*NS,9*NS,0,0,7);g.fill()});
}
function drawSky(){
  // sky is attached to the camera (gradient) with clouds scrolling slower than the world (parallax)
  const gr=g.createLinearGradient(0,CY+560,0,CY+560+H);gr.addColorStop(0,'#4aa3e8');gr.addColorStop(1,'#bfe6fb');
  g.fillStyle=gr;g.fillRect(-4000,CY-1500,W+8000,VHN+3000);
  g.fillStyle='rgba(255,255,255,.85)';
  const par=(CY-VY0)*.7,per=1000;
  [[150,100,1],[400,55,.7],[650,120,1.2],[800,50,.8]].forEach(c=>{
    const base=c[1]+par,k0=Math.ceil((CY-150-base)/per);
    for(let k=k0;k<=k0+1;k++){g.beginPath();[[0,0,50],[45,10,40],[-45,12,36],[10,-18,36]].forEach(b=>{const x=c[0]+b[0]*c[2],y=base+k*per+b[1]*c[2],r=b[2]*c[2];g.moveTo(x+r,y);g.arc(x,y,r,0,7)});g.fill()}});
  if(!broke)drawLog(GY);
  drawLog(GY+LD); // the next log waiting below
}
function drawBomb(gy){

function drawNailAt(x,y,a){ // a loose nail, drawn like a stuck one (same colors/outline), head at local top

// ---- loose nails: small rigid-body simulation (gravity, rotation, friction, collisions with the log, the stuck nails and each other)
const NL2=88*NS,NSHW=2.5*NS,NHT=4.5*NS;
const NCY=(2*NW*NHT*(-NL2/2+NHT/2))/(2*NSHW*NL2+2*NW*NHT); // centre of mass (geometry coords, y<0 = towards the heavy head)
const NI=(()=>{const m1=2*NSHW*NL2,m2=2*NW*NHT,hy=-NL2/2+NHT/2;return(m1*((2*NSHW)**2+NL2**2)/12+m1*NCY*NCY+m2*((2*NW)**2+NHT**2)/12+m2*(hy-NCY)**2)/(m1+m2)})();
const NPARTS=[[0,-NCY,NSHW,NL2/2],[0,-NL2/2+NHT/2-NCY,NW,NHT/2]]; // collision boxes in body coords (shaft, head): [cx,cy,halfW,halfH]
const NPTS=(()=>{const a=[];for(let y=-NL2/2;y<=NL2/2+.1;y+=21){a.push([-NSHW,y-NCY],[NSHW,y-NCY],[0,y-NCY])}

const NWALL={vx:0,vy:0,w:0,im:0,ii:0}; // static body used for the invisible walls
function nailVel(b,rx,ry){return[b.vx-b.w*ry,b.vy+b.w*rx]}
function nailImp(A,B,rAx,rAy,rBx,rBy,nx,ny,mu){ // impulse between A and B (B may be static), normal n points from B to A; returns the normal impulse

function physNails(dt){

function drawNail(n){ // the stuck nail is ONE shape (same as a loose nail: head, shaft, tip); the log just has a hole around the buried part, and the buried part is shaded darker
  g.save();

  const body=o=>{g.beginPath();g.moveTo(n.x-2.5*NS-o,y0);g.lineTo(n.x+2.5*NS+o,y0);g.lineTo(n.x+2.5*NS+o,tb);g.lineTo(n.x,tb+4*NS+o*1.5);g.lineTo(n.x-2.5*NS-o,tb);g.closePath();g.fill()}; // straight lower part (exposed + buried) down to the tip
  g.fillStyle=NO;body(NL); // outline pass (drawn first, slightly larger, so the fills below sit inside it)
  g.save();g.translate(n.x,y0);g.rotate(n.bent*.45);

  g.fillRect(-NW-NL,-hh-NL,2*NW+2*NL,4.5*NS+2*NL);
  g.restore();
  g.fillStyle='#9ea3ad';body(0);
  const sh=g.createLinearGradient(0,n.gy,0,tb+4*NS);sh.addColorStop(0,'rgba(20,25,40,0)');sh.addColorStop(1,'rgba(20,25,40,.4)');

  g.translate(n.x,y0);g.rotate(n.bent*.45);
  g.fillStyle='#9ea3ad';g.fillRect(-2.5*NS,-hh,5*NS,hh+1);
  g.fillStyle='#d6dae2';g.fillRect(-NW,-hh,2*NW,4.5*NS);
  g.restore();
}
function drawTrail(){ // faint streak behind the pick tips, only while moving fast
  g.save();g.strokeStyle='#fff';g.lineCap='round';
  for(const a of trail)for(let k=1;k<a.length;k++){const p=a[k-1],q=a[k],f=Math.min(1,(q.s-800)/900);if(f<=0)continue;g.globalAlpha=f*k/a.length*.55;g.lineWidth=4+10*k/a.length;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke()}

}
function drawHammer(){
  g.save();g.translate(hm.x,hm.y);g.rotate(hm.a);g.scale(S,S);

  g.fillStyle='#b97a3a';g.fillRect(-84,-8,471,5);

function text(s,x,y,size,col,al){g.font=`700 ${size}px "Trebuchet MS",system-ui,sans-serif`;g.textAlign=al||'left';g.lineWidth=5;g.strokeStyle='rgba(30,14,2,.85)';g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y)}
function render(){
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#1b1209';g.fillRect(0,0,cv.width,cv.height);
  const shx=(Math.random()-.5)*shake*sc,shy=(Math.random()-.5)*shake*sc;{const zz=1+zm,cx=cv.width/2,cy=cv.height/2,e0=ox-VX0*sc+shx,f0=oy-CY*sc+shy;g.setTransform(sc*zz,0,0,sc*zz,cx+(e0-cx)*zz,cy+(f0-cy)*zz)}

  text(`${T.time} ${t.toFixed(1)}s`,24,126,22,'#ffe0a8');

let last=performance.now();
function loop(now){

  if(hs>0)hs-=dt;

    let target=1;

  }
